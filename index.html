
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Angry Birds Bomb</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #gameArea {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }

        #spaceControls {
            display: none;
            position: fixed;
            bottom: 8px;
            left: 0;
            width: 100%;
            z-index: 9999;
            text-align: center;
            background: transparent;
            border: none;
            padding: 0;
            pointer-events: none;
            touch-action: manipulation;
        }

        #spaceButton {
            display: block;
            width: 170px;
            max-width: 65%;
            height: 42px;
            margin: 0 auto;
            border: 1px solid #d5a329;
            border-radius: 8px;
            background: rgba(247, 203, 77, 0.92);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22);
            color: #222;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #spaceButton:active,
        #spaceButton.pressed {
            background: #e8b82f;
            transform: translateY(1px);
        }

        #spaceHint {
            display: none;
        }

        @media (hover: none) and (pointer: coarse) {
            #spaceControls {
                display: block;
            }
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="gameArea">
            <embed
                src="Angry Birds Bomb.swf"
                id="gameEmbed"
                width="100%"
                height="100%">
        </div>

        <div id="spaceControls">
            <button type="button" id="spaceButton">
                ␣ &nbsp; SPACE
            </button>
            <p id="spaceHint">Toca para activar la barra espaciadora</p>
        </div>
    </div>

    <script>
        const spaceButton = document.getElementById("spaceButton");
        const gameEmbed = document.getElementById("gameEmbed");

        let spacePressed = false;

        function sendSpace(type) {
            const targets = [document.activeElement, gameEmbed, document];

            for (const target of targets) {
                if (!target || typeof target.dispatchEvent !== "function") {
                    continue;
                }

                target.dispatchEvent(new KeyboardEvent(type, {
                    key: " ",
                    code: "Space",
                    keyCode: 32,
                    which: 32,
                    bubbles: true,
                    cancelable: true
                }));
            }
        }

        spaceButton.addEventListener("pointerdown", function(event) {
            event.preventDefault();

            if (spacePressed) return;

            spacePressed = true;
            spaceButton.classList.add("pressed");
            sendSpace("keydown");
        });

        function releaseSpace() {
            if (!spacePressed) return;

            spacePressed = false;
            spaceButton.classList.remove("pressed");
            sendSpace("keyup");
        }

        spaceButton.addEventListener("pointerup", releaseSpace);
        spaceButton.addEventListener("pointercancel", releaseSpace);
        window.addEventListener("blur", releaseSpace);

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) releaseSpace();
        });
    </script>
</body>
</html>
