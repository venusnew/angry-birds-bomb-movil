
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds Bomb Movil</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="https://apis.google.com/js/platform.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }

        #spaceControls {
            display: none;
            position: fixed;
            bottom: 8px;
            left: 0;
            width: 100%;
            z-index: 9999;
            text-align: center;
            pointer-events: none;
        }

        #spaceButton {
            pointer-events: auto;
            width: 170px;
            max-width: 65%;
            height: 42px;
            background: rgba(247, 203, 77, 0.92);
            color: #222;
            border: 1px solid #d5a329;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.22);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #spaceButton:active,
        #spaceButton.pressed {
            background: #e8b82f;
            transform: translateY(1px);
        }

        @media (hover: none) and (pointer: coarse) {
            #spaceControls {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor original del juego: escala sin cambios -->
    <div class="game-container" id="gameContainer">
        <embed src="Angry Birds Bomb.swf" id="gameEmbed" width="100%" height="100%">
    </div>

    <!-- Botón táctil de barra espaciadora -->
    <div id="spaceControls">
        <button type="button" id="spaceButton">␣ SPACE</button>
    </div>

    <script>
        const spaceButton = document.getElementById("spaceButton");
        const gameEmbed = document.getElementById("gameEmbed");

        let spacePressed = false;

        function sendSpace(type) {
            const targets = [
                document.activeElement,
                gameEmbed,
                document
            ];

            for (const target of targets) {
                if (!target || typeof target.dispatchEvent !== "function") {
                    continue;
                }

                target.dispatchEvent(new KeyboardEvent(type, {
                    key: " ",
                    code: "Space",
                    keyCode: 32,
                    which: 32,
                    bubbles: true,
                    cancelable: true
                }));
            }
        }

        spaceButton.addEventListener("pointerdown", function(event) {
            event.preventDefault();

            if (spacePressed) return;

            spacePressed = true;
            spaceButton.classList.add("pressed");
            sendSpace("keydown");
        });

        function releaseSpace() {
            if (!spacePressed) return;

            spacePressed = false;
            spaceButton.classList.remove("pressed");
            sendSpace("keyup");
        }

        spaceButton.addEventListener("pointerup", releaseSpace);
        spaceButton.addEventListener("pointercancel", releaseSpace);
        window.addEventListener("blur", releaseSpace);

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) releaseSpace();
        });
    </script>
</body>
</html>
